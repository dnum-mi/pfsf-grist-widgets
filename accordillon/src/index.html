<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vue groupée — Grist widget</title>
    <meta name="widget-version" content="%VITE_APP_VERSION%" />
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar" aria-label="Options de groupement">
        <div class="toolbar-group">
          <label for="group-select">Grouper par</label>
          <select id="group-select">
            <option value="">— choisir —</option>
          </select>
        </div>
        <div class="toolbar-sep" role="separator" aria-orientation="vertical"></div>
        <div class="toolbar-group">
          <label for="sort-select">Tri</label>
          <select id="sort-select">
            <option value="alpha-asc">A → Z</option>
            <option value="alpha-desc">Z → A</option>
            <option value="count-desc">Nb ↓</option>
            <option value="count-asc">Nb ↑</option>
          </select>
        </div>
        <div class="toolbar-right">
          <span id="dev-badge" class="badge-dev" style="display: none"></span>
          <button class="btn" id="btn-expand" type="button">Tout déplier</button>
          <button class="btn" id="btn-collapse" type="button">Tout plier</button>
          <div class="toolbar-sep" role="separator" aria-orientation="vertical"></div>
          <button
            class="btn-icon"
            id="btn-settings"
            type="button"
            aria-label="Réglages d'affichage"
            aria-expanded="false"
            aria-controls="settings-panel"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
          </button>
        </div>
      </header>

      <div
        class="settings-panel"
        id="settings-panel"
        role="region"
        aria-label="Réglages d'affichage"
      >
        <div>
          <p class="setting-section-title" id="lbl-colors">Couleurs des groupes</p>
          <div class="color-grid" id="color-grid" aria-labelledby="lbl-colors"></div>
        </div>

        <div>
          <p class="setting-section-title" id="lbl-maxh">Hauteur max par groupe</p>
          <div style="display: flex; align-items: center; gap: 8px">
            <input
              type="range"
              id="maxh-range"
              min="80"
              max="1000"
              step="20"
              value="500"
              aria-labelledby="lbl-maxh"
              style="flex: 1; accent-color: var(--accent)"
            />
            <span
              id="maxh-val"
              style="font-family: var(--mono); font-size: 11px; color: var(--text); min-width: 36px"
              >500px</span
            >
            <button
              class="btn-reset-color"
              type="button"
              id="btn-reset-maxh"
              aria-label="Réinitialiser la hauteur maximale"
            >
              Réinitialiser
            </button>
          </div>
        </div>

        <div id="bool-section" style="display: none">
          <p class="setting-section-title" id="lbl-bool">Affichage vrai / faux</p>
          <div class="bool-row" id="bool-row" role="radiogroup" aria-labelledby="lbl-bool"></div>
        </div>
        <p class="widget-version" id="widget-version">v%VITE_APP_VERSION%</p>
      </div>

      <div class="statsbar" id="statsbar" role="status">
        <span><span class="stat-val" id="stat-groups">0</span> groupes</span>
        <span aria-hidden="true">·</span>
        <span><span class="stat-val" id="stat-records">0</span> enregistrements</span>
      </div>

      <main class="content" id="content" aria-label="Groupes d'enregistrements">
        <div class="empty" id="empty-state">
          <svg
            width="40"
            height="40"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.2"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="3" y="3" width="18" height="18" rx="2.5" />
            <path d="M3 9h18M9 21V9" />
          </svg>
          <p class="empty-title">Aucune colonne sélectionnée</p>
          <p class="empty-sub">
            Choisis une colonne dans la barre ci-dessus<br />pour grouper les enregistrements.
          </p>
        </div>
      </main>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
